name: Stellium CI/CD Quality Gate

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Ruff Linter Check
        run: uv run ruff check --output-format=github

      - name: Ruff Code Formatting Check
        run: uv run ruff format --check

      - name: Mypy Strict Static Typing
        run: uv run mypy src/

  test-suite:
    name: Test Suite & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Pytest with Coverage
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --durations=10 \
            -v

      - name: Benchmark CLI Smoke Test
        run: |
          uv run python -m src.evaluate \
            --dataset hackathon-resources/questions/eval_public.jsonl \
            --pipeline agentic \
            --limit 3 \
            --output results/ci_smoke_results.jsonl
          test -f results/ci_smoke_results.jsonl

      - name: API Server Smoke Test
        run: |
          uv run uvicorn src.api.main:app --port 8000 &
          PID=$!
          sleep 4
          curl -f http://127.0.0.1:8000/health || (kill $PID && exit 1)
          curl -f http://127.0.0.1:8000/api/v1/graph/snapshot || (kill $PID && exit 1)
          kill $PID
