name: Stellium CI/CD Quality Gate

on:
  push:
    branches: [main, "release/**", "feature/**", "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.5"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --locked --extra dev

      - name: Ruff Linter Check
        run: uv run ruff check --output-format=github

      - name: Ruff Code Formatting Check
        run: uv run ruff format --check

      - name: Mypy Strict Static Typing
        run: uv run mypy src/ tests/

      - name: Bandit Security Scan
        run: uv run bandit -r src/ -ll

      - name: Dependency Vulnerability Audit
        run: uv run pip-audit

  test-suite:
    name: Test Suite & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TG_USE_MOCK: "1"
      TG_RUN_LIVE_TESTS: "0"
      CLOUDFLARE_ACCOUNT_ID: ""
      CLOUDFLARE_API_TOKEN: ""
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.5"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --locked --extra dev

      - name: Run Pytest with Coverage
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            --durations=10 \
            -v

      - name: Benchmark CLI Smoke Test
        run: |
          uv run python -m src.evaluate \
            --dataset hackathon-resources/questions/eval_public.jsonl \
            --pipeline agentic \
            --limit 3 \
            --output results/ci_smoke_results.jsonl
          test -f results/ci_smoke_results.jsonl

      - name: API Server Smoke Test
        run: |
          set -euo pipefail
          uv run uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/api/v1/graph/snapshot >/dev/null
