# Keeps the deployed API and its TigerGraph workspace awake: a real graph read every 10 minutes.
# Set the repository variable STELLIUM_API_URL (e.g. https://stellium-api.onrender.com) to enable;
# without it the job does nothing. GitHub may delay scheduled runs at busy times.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.STELLIUM_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the graph through the API
        env:
          API_URL: ${{ vars.STELLIUM_API_URL }}
        # A cold Render start plus a workspace resume can take a few minutes.
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 240 "$API_URL/health?deep=true"
