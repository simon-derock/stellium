[project]
name = "stellium"
version = "0.1.0"
description = "Agentic GraphRAG System on TigerGraph Savanna for Historical Olympics Reasoning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pytigergraph>=1.5.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "mistralai>=1.0.0",
    "google-genai>=0.1.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.168.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5,<6",
    "vulture>=2.16,<3",
]
