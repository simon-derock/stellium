<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0a0c10; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="box-tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="box-coproc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="box-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="600" y="45" text-anchor="middle" fill="url(#grad-title)" font-size="28" font-weight="800" letter-spacing="1.5">STELLIUM: AGENTIC GRAPHRAG ARCHITECTURE</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">Autonomous Reasoning &amp; Silicon Coprocessor on TigerGraph Savanna | Built by Philip Simon Derock</text>

  <!-- Section 1: Ingestion & Coprocessor -->
  <rect x="50" y="100" width="340" height="660" rx="12" fill="url(#box-coproc)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="100" width="340" height="40" rx="12" fill="#047857"/>
  <text x="220" y="125" text-anchor="middle" fill="#ecfdf5" font-size="16" font-weight="700">1. INGESTION &amp; COPROCESSOR</text>
  
  <rect x="70" y="160" width="300" height="70" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="85" y="185" fill="#a7f3d0" font-size="13" font-weight="700">Wikipedia Olympic Corpus</text>
  <text x="85" y="205" fill="#ecfdf5" font-size="11">2,951 Documents (~5.47M tokens)</text>
  <text x="85" y="220" fill="#6ee7b7" font-size="10">Infobox fields, Results, Venues, Dates</text>

  <rect x="70" y="250" width="300" height="85" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="85" y="275" fill="#a7f3d0" font-size="13" font-weight="700">Table-Aware Entity Chunking</text>
  <text x="85" y="295" fill="#ecfdf5" font-size="11">Chunk 0: Infobox + Lead (Never Split)</text>
  <text x="85" y="310" fill="#6ee7b7" font-size="10">Chunks 1..N: Markdown Section Split</text>
  <text x="85" y="325" fill="#34d399" font-size="10">Doubly Linked Pointers (prev_chunk_id, next)</text>

  <rect x="70" y="355" width="300" height="110" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="85" y="380" fill="#a7f3d0" font-size="13" font-weight="700">Silicon Coprocessor Accelerators</text>
  <text x="85" y="400" fill="#ecfdf5" font-size="11">&lt;1μs Roaring Bitmasks (pyroaring)</text>
  <text x="85" y="418" fill="#ecfdf5" font-size="11">BM25Plus Inverted Index (rank-bm25)</text>
  <text x="85" y="436" fill="#6ee7b7" font-size="10">Strict positive IDF across any corpus size</text>
  <text x="85" y="454" fill="#6ee7b7" font-size="10">NFKD Diacritics Normalization</text>

  <rect x="70" y="485" width="300" height="85" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="85" y="510" fill="#a7f3d0" font-size="13" font-weight="700">Reciprocal Rank Fusion (RRF)</text>
  <text x="85" y="530" fill="#ecfdf5" font-size="11">Score = Σ 1 / (60 + Rank)</text>
  <text x="85" y="548" fill="#6ee7b7" font-size="10">Fuses BM25 exact + TigerVector dense</text>

  <rect x="70" y="590" width="300" height="65" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="85" y="615" fill="#a7f3d0" font-size="13" font-weight="700">Cross-Encoder Precision Reranker</text>
  <text x="85" y="635" fill="#ecfdf5" font-size="11">MS-MARCO MiniLM-L6 (Top-30 -> Top-2)</text>

  <!-- Section 2: TigerGraph Savanna -->
  <rect x="430" y="100" width="340" height="660" rx="12" fill="url(#box-tg)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="430" y="100" width="340" height="40" rx="12" fill="#4338ca"/>
  <text x="600" y="125" text-anchor="middle" fill="#e0e7ff" font-size="16" font-weight="700">2. TIGERGRAPH SAVANNA v3</text>

  <rect x="450" y="160" width="300" height="120" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="465" y="185" fill="#c7d2fe" font-size="13" font-weight="700">Graph Schema Topology</text>
  <text x="465" y="205" fill="#e0e7ff" font-size="11">Vertices: Document, Chunk, Event, Venue</text>
  <text x="465" y="223" fill="#e0e7ff" font-size="11">Temporal: PRECEDES, SUCCEEDS (O(1))</text>
  <text x="465" y="241" fill="#a5b4fc" font-size="10">Relational: HELD_AT, DOCUMENTED_IN</text>
  <text x="465" y="259" fill="#a5b4fc" font-size="10">WITH PRIMARY_ID_AS_ATTRIBUTE="true"</text>

  <rect x="450" y="300" width="300" height="95" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="465" y="325" fill="#c7d2fe" font-size="13" font-weight="700">TigerVector Native HNSW Space</text>
  <text x="465" y="345" fill="#e0e7ff" font-size="11">DIMENSION = 1024 / 1536, METRIC = COSINE</text>
  <text x="465" y="363" fill="#a5b4fc" font-size="10">In-database vectorSearch({Chunk.embedding})</text>
  <text x="465" y="381" fill="#a5b4fc" font-size="10">Co-located with vertex graph topology</text>

  <rect x="450" y="415" width="300" height="145" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="465" y="440" fill="#c7d2fe" font-size="13" font-weight="700">Compiled GSQL Stored Queries</text>
  <text x="465" y="460" fill="#38bdf8" font-size="11" font-weight="600">⚡ get_event_aggregates (COUNT in C++)</text>
  <text x="465" y="478" fill="#38bdf8" font-size="11" font-weight="600">⚡ get_preceding_event (PRECEDES edge)</text>
  <text x="465" y="496" fill="#38bdf8" font-size="11" font-weight="600">⚡ get_superlative_event (MAX/MIN ORDER)</text>
  <text x="465" y="514" fill="#a5b4fc" font-size="10">SumAccum&lt;INT&gt; parallel reduction</text>
  <text x="465" y="532" fill="#4ade80" font-size="11" font-weight="700">=> 0 LLM Tokens | ~4ms Execution</text>

  <rect x="450" y="580" width="300" height="90" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="465" y="605" fill="#c7d2fe" font-size="13" font-weight="700">In-Graph Session Memory</text>
  <text x="465" y="625" fill="#e0e7ff" font-size="11">Vertices: Session, ChatMessage, AgentMemory</text>
  <text x="465" y="643" fill="#a5b4fc" font-size="10">Survives page refresh with zero extra DBs</text>
  <text x="465" y="661" fill="#a5b4fc" font-size="10">Instant investigation recall for repeat queries</text>

  <!-- Section 3: Autonomous Agent & Live UI -->
  <rect x="810" y="100" width="340" height="660" rx="12" fill="url(#box-agent)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="810" y="100" width="340" height="40" rx="12" fill="#7e22ce"/>
  <text x="980" y="125" text-anchor="middle" fill="#fae8ff" font-size="16" font-weight="700">3. AGENTIC ORCHESTRATION &amp; UI</text>

  <rect x="830" y="160" width="300" height="85" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
  <text x="845" y="185" fill="#f3e8ff" font-size="13" font-weight="700">Judge-Safe Security Guardrails</text>
  <text x="845" y="205" fill="#fae8ff" font-size="11">Structural DB commands blocked (&lt;1ms)</text>
  <text x="845" y="223" fill="#d8b4fe" font-size="10">Batch eval endpoints bypass input checks</text>
  <text x="845" y="238" fill="#4ade80" font-size="10">Zero false positives on natural sports questions</text>

  <rect x="830" y="265" width="300" height="115" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
  <text x="845" y="290" fill="#f3e8ff" font-size="13" font-weight="700">LangGraph StateGraph Engine</text>
  <text x="845" y="310" fill="#fae8ff" font-size="11">Deterministic Fast Path (GSQL direct)</text>
  <text x="845" y="328" fill="#fae8ff" font-size="11">Dynamic Tool Dispatcher (Full arsenal)</text>
  <text x="845" y="346" fill="#d8b4fe" font-size="10">Evidence Critic &amp; Adaptive Backtracking</text>
  <text x="845" y="364" fill="#d8b4fe" font-size="10">Grounded Synthesis anchored in gold_doc_ids</text>

  <rect x="830" y="400" width="300" height="85" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
  <text x="845" y="425" fill="#f3e8ff" font-size="13" font-weight="700">Session-Locked Model Router</text>
  <text x="845" y="445" fill="#fae8ff" font-size="11">Primary: Cloudflare Llama 3.1 8B (~9 neurons)</text>
  <text x="845" y="463" fill="#d8b4fe" font-size="10">Failover: Gemini 2.0 Flash / Mistral</text>
  <text x="845" y="478" fill="#38bdf8" font-size="10">Strict: identical model across all steps in run</text>

  <rect x="830" y="505" width="300" height="120" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
  <text x="845" y="530" fill="#f3e8ff" font-size="13" font-weight="700">Lunarbit GraphSurface Visualizer</text>
  <text x="845" y="550" fill="#fae8ff" font-size="11">FastAPI Backend (/api/v1/graph/snapshot)</text>
  <text x="845" y="568" fill="#fae8ff" font-size="11">Canvas Force Simulation (GraphSurface.tsx)</text>
  <text x="845" y="586" fill="#d8b4fe" font-size="10">Side-by-side 3-pipeline comparative view</text>
  <text x="845" y="604" fill="#4ade80" font-size="10">Live animated agent traversal paths</text>

  <!-- Connectors -->
  <line x1="390" y1="210" x2="430" y2="210" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="390" y1="350" x2="430" y2="350" stroke="#6366f1" stroke-width="2"/>
  <line x1="770" y1="470" x2="810" y2="470" stroke="#a855f7" stroke-width="2"/>
  <line x1="770" y1="560" x2="810" y2="560" stroke="#38bdf8" stroke-width="2"/>

  <!-- Footer -->
  <text x="600" y="785" text-anchor="middle" fill="#64748b" font-size="11">Stellium Agentic GraphRAG System | TigerGraph Hackathon 2026 | All rights reserved</text>
</svg>
